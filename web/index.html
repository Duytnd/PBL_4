<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniBitorrent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard">MiniBitorrent</a>
    <form class="search" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" placeholder="Search for a torrent" aria-label="Search for a torrent">
    </form>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Main">
      <a href="#/dashboard" data-view="dashboard">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#/torrents" data-view="torrents">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M4.5 7.5L8 4l3.5 3.5M16 20V4M12.5 16.5L16 20l3.5-3.5"/></svg>
        <span>Torrents</span>
      </a>
      <a href="#/speed" data-view="speed">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/></svg>
        <span>Speed</span>
      </a>
    </nav>

    <main>
      <section class="view" id="view-dashboard" aria-label="Dashboard">
        <div class="tiles">
          <div class="tile"><div class="tile-label">Bytes downloaded</div><div class="tile-value">0 B</div></div>
          <div class="tile"><div class="tile-label">Bytes uploaded</div><div class="tile-value">0 B</div></div>
        </div>
        <div id="dashboard-dropzone" class="dropzone">
          <span>Drag and drop a file. <u>Click to create a torrent.</u></span>
        </div>
      </section>

      <section class="view" id="view-torrents" aria-label="Torrents" hidden>
        <div class="toolbar">
          <label class="select-all"><input type="checkbox"><span class="sr-only">Select all</span></label>
          <label class="field">Show:
            <select>
              <option>All</option>
              <option>Downloading</option>
              <option>Seeding</option>
              <option>Paused</option>
            </select>
          </label>
          <label class="field">Sort:
            <select>
              <option>Most Recent</option>
              <option>Name</option>
              <option>Size</option>
            </select>
          </label>
          <span class="spacer"></span>
          <button id="create-torrent-btn" type="button" class="btn btn-primary">Create torrent <span aria-hidden="true">+</span></button>
          <button id="add-torrent-btn" type="button" class="btn">Add torrent <span aria-hidden="true">+</span></button>
        </div>

        <div id="torrent-builder" class="torrent-builder">
          <input id="torrent-source" type="file" hidden>
          <div id="torrent-status" class="torrent-status" aria-live="polite">No torrent added yet.</div>
        </div>

        <div id="torrent-list" class="torrent-list" aria-live="polite"></div>

        <div id="torrent-dropzone" class="dropzone">
          <span>Drag and drop a file here, or click to create a .torrent.</span>
        </div>
      </section>

      <section class="view" id="view-speed" aria-label="Speed" hidden>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Download speed</div><div class="tile-value">0 B/s</div></div>
          <div class="tile"><div class="tile-label">Upload speed</div><div class="tile-value">0 B/s</div></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
